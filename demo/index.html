<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>M3E Kit — 部品図鑑</title>

    <!-- ★リポジトリのルートから配ること★
         starter/ の CSS を相対パスでそのまま読んでいる。図鑑自身も同じ
         トークンで組んであるので、書いてある値と目に見えるものは必ず一致する。
           npm run demo   →  http://localhost:8080/demo/ -->
    <link rel="stylesheet" href="../starter/styles/components.css" />
    <link rel="stylesheet" href="site.css" />
  </head>

  <body>
    <div class="site">
      <!-- ================================================= 上の帯 -->
      <header class="top">
        <button class="iconbtn top__menu" id="menu" aria-label="索引">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <div class="top__brand">M3E Kit <small id="count"></small></div>

        <div class="top__spacer"></div>

        <div class="swatches" id="seeds" aria-label="テーマの色"></div>

        <button class="iconbtn" id="theme" aria-label="明るさ: system">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5" />
          </svg>
        </button>
      </header>

      <!-- ================================================= 本体 -->
      <div class="body">
        <!-- 左: 索引 -->
        <nav class="index" id="index-panel" aria-label="部品の索引">
          <div class="index__search">
            <div class="search">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
              </svg>
              <input class="search__input" id="q" placeholder="部品を探す（⌘K）" aria-label="部品を探す" />
            </div>
          </div>
          <div class="index__list" id="index"></div>
        </nav>

        <!-- 右: 選んだ部品 -->
        <main class="detail" id="detail"></main>
      </div>
    </div>

    <script type="module" src="site.js"></script>
  </body>
</html>
